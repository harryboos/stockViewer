name: private-apps

x-log-policy: &log-policy
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_healthy
      stock-viewer:
        condition: service_healthy
      legend-football-manager:
        condition: service_healthy
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?请配置入口域名}
      STOCK_DOMAIN: ${STOCK_DOMAIN:?请配置股票应用域名}
      FOOTBALL_DOMAIN: ${FOOTBALL_DOMAIN:?请配置足球应用域名}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private-apps
    logging: *log-policy

  portal:
    build:
      context: ./portal
      args:
        NODE_BASE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      PORT: 3000
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?请配置入口域名}
      STOCK_DOMAIN: ${STOCK_DOMAIN:?请配置股票应用域名}
      FOOTBALL_DOMAIN: ${FOOTBALL_DOMAIN:?请配置足球应用域名}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?请配置 Cookie 根域名}
      COOKIE_SECURE: "true"
      SITE_ACCESS_KEY: ${SITE_ACCESS_KEY:?请配置至少12位的访问密钥}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:?请配置至少32位的随机会话密钥}
    expose:
      - "3000"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - private-apps
    logging: *log-policy

  stock-viewer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.stock
      args:
        NODE_BASE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      TZ: Asia/Shanghai
      STOCK_BACKEND_PORT: 8000
      STOCK_BACKEND_URL: http://127.0.0.1:8000
      STOCK_VIEWER_DB: /app/data/stockviewer.sqlite3
      SPOT_CACHE_SECONDS: ${SPOT_CACHE_SECONDS:-900}
      PRIMARY_FAILURE_BACKOFF_SECONDS: ${PRIMARY_FAILURE_BACKOFF_SECONDS:-1800}
      EASTMONEY_DELAY_ENABLED: ${EASTMONEY_DELAY_ENABLED:-true}
      EASTMONEY_PAGE_DELAY_SECONDS: ${EASTMONEY_PAGE_DELAY_SECONDS:-0.25}
      EASTMONEY_DELAY_HOSTS: ${EASTMONEY_DELAY_HOSTS:-}
      STRATEGY_SAMPLE_SIZE: ${STRATEGY_SAMPLE_SIZE:-18}
      HOT_CONCEPT_LIMIT: ${HOT_CONCEPT_LIMIT:-5}
      ENABLE_DAILY_SCHEDULER: ${ENABLE_DAILY_SCHEDULER:-true}
      DAILY_RUN_HOUR: ${DAILY_RUN_HOUR:-18}
      DAILY_RUN_MINUTE: ${DAILY_RUN_MINUTE:-10}
      DAILY_RUN_SECRET: ${DAILY_RUN_SECRET:-}
      DEEPSEEK_API_KEY: ${STOCK_DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${STOCK_DEEPSEEK_MODEL:-deepseek-chat}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    expose:
      - "3000"
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - private-apps
    logging: *log-policy

  legend-football-manager:
    image: ${NODE_IMAGE:-node:22-bookworm-slim}
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      PORT: 3000
      TZ: Asia/Shanghai
      SITE_ACCESS_KEY: ${SITE_ACCESS_KEY:?请配置至少12位的访问密钥}
      DEEPSEEK_API_KEY: ${FOOTBALL_DEEPSEEK_API_KEY:-}
    expose:
      - "3000"
    volumes:
      - ../../legend-football-manager:/app:ro
      - ../../legend-football-manager/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/gate/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - private-apps
    logging: *log-policy

networks:
  private-apps:
    driver: bridge

volumes:
  caddy_config:
  caddy_data:
